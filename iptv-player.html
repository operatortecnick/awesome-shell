<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f13;
      --surface:  #1a1a24;
      --surface2: #22222f;
      --border:   #2e2e40;
      --accent:   #6c63ff;
      --accent2:  #ff6584;
      --text:     #e8e8f0;
      --muted:    #8888aa;
      --radius:   10px;
    }

    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* ── Layout ───────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 320px 1fr;
      grid-template-areas:
        "header header"
        "sidebar player";
      height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
    header h1 span { color: var(--accent); }

    .header-controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }

    select, input, button {
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      padding: 6px 10px;
      outline: none;
      transition: border-color .2s;
    }
    select:focus, input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button.secondary { background: var(--surface2); border-color: var(--border); color: var(--text); }

    /* ── Sidebar ──────────────────────────────────────── */
    .sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .sidebar-top {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    #searchInput {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface2);
    }

    .filter-row { display: flex; gap: 6px; }
    .filter-row select { flex: 1; min-width: 0; }

    .channel-count {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 12px 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .channel-list::-webkit-scrollbar { width: 6px; }
    .channel-list::-webkit-scrollbar-track { background: transparent; }
    .channel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    .channel-item:hover { background: var(--surface2); }
    .channel-item.active { background: rgba(108,99,255,.15); border-left: 3px solid var(--accent); }

    .channel-logo {
      width: 40px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .channel-logo-placeholder {
      width: 40px;
      height: 30px;
      background: var(--surface2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: var(--muted);
      flex-shrink: 0;
      text-align: center;
      overflow: hidden;
    }

    .channel-info { min-width: 0; }
    .channel-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-group {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Player area ──────────────────────────────────── */
    .player-area {
      grid-area: player;
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }

    .video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
    }
    .overlay-msg svg { width: 64px; height: 64px; opacity: .4; }
    .overlay-msg p { opacity: .7; }

    .player-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .now-playing { min-width: 0; flex: 1; }
    .now-playing .np-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-playing .np-url  { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      box-shadow: 0 0 0 0 rgba(108,99,255,0);
    }
    .status-dot.live {
      background: #4ade80;
      animation: pulse 1.5s infinite;
    }
    .status-dot.error { background: var(--accent2); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,.4); }
      50%      { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    }

    .custom-url-row {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .custom-url-row input { flex: 1; }

    /* ── Loading spinner ───────────────────────────────── */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty / error states ─────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px;
      text-align: center;
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 700px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 56px 55vh 40px 1fr;
        grid-template-areas:
          "header"
          "player"
          "player"
          "sidebar";
      }
      .sidebar { border-right: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <header>
    <h1>IPTV<span>·</span>Player</h1>
    <div class="header-controls">
      <select id="playlistSelect">
        <option value="">— Selecionar playlist —</option>
        <option value="https://iptv-org.github.io/iptv/index.m3u">🌍 Todas as Categorias</option>
        <option value="https://iptv-org.github.io/iptv/countries/br.m3u">🇧🇷 Brasil</option>
        <option value="https://iptv-org.github.io/iptv/countries/us.m3u">🇺🇸 Estados Unidos</option>
        <option value="https://iptv-org.github.io/iptv/countries/pt.m3u">🇵🇹 Portugal</option>
        <option value="https://iptv-org.github.io/iptv/countries/es.m3u">🇪🇸 Espanha</option>
        <option value="https://iptv-org.github.io/iptv/countries/ar.m3u">🇦🇷 Argentina</option>
        <option value="https://iptv-org.github.io/iptv/countries/mx.m3u">🇲🇽 México</option>
        <option value="https://iptv-org.github.io/iptv/countries/gb.m3u">🇬🇧 Reino Unido</option>
        <option value="https://iptv-org.github.io/iptv/countries/fr.m3u">🇫🇷 França</option>
        <option value="https://iptv-org.github.io/iptv/countries/de.m3u">🇩🇪 Alemanha</option>
        <option value="https://iptv-org.github.io/iptv/countries/it.m3u">🇮🇹 Itália</option>
        <option value="https://iptv-org.github.io/iptv/countries/jp.m3u">🇯🇵 Japão</option>
        <option value="https://iptv-org.github.io/iptv/countries/kr.m3u">🇰🇷 Coreia do Sul</option>
        <option value="https://iptv-org.github.io/iptv/categories/news.m3u">📰 Notícias</option>
        <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">⚽ Esportes</option>
        <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">🎬 Filmes</option>
        <option value="https://iptv-org.github.io/iptv/categories/music.m3u">🎵 Música</option>
        <option value="https://iptv-org.github.io/iptv/categories/kids.m3u">👶 Infantil</option>
        <option value="https://iptv-org.github.io/iptv/categories/documentary.m3u">🎥 Documentários</option>
      </select>
      <button id="loadBtn">Carregar</button>
    </div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <input id="searchInput" type="search" placeholder="🔍 Buscar canal..." />
      <div class="filter-row">
        <select id="groupFilter"><option value="">Todos os grupos</option></select>
      </div>
    </div>
    <div class="channel-count" id="channelCount"></div>
    <div class="channel-list" id="channelList">
      <div class="empty-state">
        <p>Selecione uma playlist acima<br>ou cole uma URL M3U personalizada</p>
      </div>
    </div>
  </aside>

  <!-- ── Player ── -->
  <main class="player-area">
    <div class="video-wrapper">
      <video id="video" controls playsinline></video>
      <div class="overlay-msg" id="overlayMsg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <p>Escolha um canal para começar</p>
      </div>
      <div class="spinner" id="spinner"></div>
    </div>

    <div class="player-bar">
      <div class="status-dot" id="statusDot"></div>
      <div class="now-playing">
        <div class="np-name" id="npName">Nenhum canal selecionado</div>
        <div class="np-url"  id="npUrl">—</div>
      </div>
    </div>

    <div class="custom-url-row">
      <input id="customUrl" type="url" placeholder="Cole uma URL M3U personalizada aqui..." />
      <button id="loadCustomBtn" class="secondary">Carregar M3U</button>
      <input id="streamUrl" type="url" placeholder="Ou cole diretamente uma URL de stream (.m3u8, .ts)..." />
      <button id="playStreamBtn" class="secondary">▶ Play</button>
    </div>
  </main>

</div>

<script>
  /* ── State ─────────────────────────────────────────── */
  let channels = [];
  let filtered = [];
  let hls = null;
  let activeIdx = -1;

  /* ── DOM refs ──────────────────────────────────────── */
  const video       = document.getElementById('video');
  const channelList = document.getElementById('channelList');
  const searchInput = document.getElementById('searchInput');
  const groupFilter = document.getElementById('groupFilter');
  const channelCount= document.getElementById('channelCount');
  const overlayMsg  = document.getElementById('overlayMsg');
  const spinner     = document.getElementById('spinner');
  const statusDot   = document.getElementById('statusDot');
  const npName      = document.getElementById('npName');
  const npUrl       = document.getElementById('npUrl');
  const playlistSel = document.getElementById('playlistSelect');
  const loadBtn     = document.getElementById('loadBtn');
  const customUrl   = document.getElementById('customUrl');
  const loadCustom  = document.getElementById('loadCustomBtn');
  const streamUrl   = document.getElementById('streamUrl');
  const playStream  = document.getElementById('playStreamBtn');

  /* ── M3U parser ────────────────────────────────────── */
  function parseM3U(text) {
    const lines = text.split(/\r?\n/);
    const result = [];
    let current = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      if (line.startsWith('#EXTINF')) {
        current = { name: '', logo: '', group: '', url: '' };
        const nameMatch = line.match(/,(.+)$/);
        if (nameMatch) current.name = nameMatch[1].trim();

        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
        if (logoMatch) current.logo = logoMatch[1];

        const groupMatch = line.match(/group-title="([^"]*)"/i);
        if (groupMatch) current.group = groupMatch[1];

        const nameTag = line.match(/tvg-name="([^"]*)"/i);
        if (nameTag && !current.name) current.name = nameTag[1];

      } else if (line.startsWith('#')) {
        // skip other directives
      } else if (current) {
        current.url = line;
        if (current.name || current.url) result.push(current);
        current = null;
      }
    }
    return result;
  }

  /* ── Load playlist ─────────────────────────────────── */
  async function loadPlaylist(url) {
    setStatus('loading');
    channelList.innerHTML = '<div class="empty-state"><div class="spinner" style="display:block;margin:auto"></div><p style="margin-top:14px">Carregando canais…</p></div>';
    channelCount.textContent = '';

    try {
      // Try with a CORS proxy first, then direct
      let text = '';
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        url,
      ];

      for (const src of proxies) {
        try {
          const res = await fetch(src, { signal: AbortSignal.timeout(15000) });
          if (res.ok) { text = await res.text(); break; }
        } catch { /* try next */ }
      }

      if (!text) throw new Error('Não foi possível carregar a playlist. Verifique a URL ou sua conexão.');

      channels = parseM3U(text);
      if (!channels.length) throw new Error('Nenhum canal encontrado na playlist.');

      populateGroups();
      applyFilters();
      setStatus('idle');
    } catch (err) {
      channelList.innerHTML = `<div class="empty-state">⚠️ ${err.message}</div>`;
      setStatus('idle');
    }
  }

  /* ── Group filter ──────────────────────────────────── */
  function populateGroups() {
    const groups = [...new Set(channels.map(c => c.group).filter(Boolean))].sort();
    groupFilter.innerHTML = '<option value="">Todos os grupos</option>' +
      groups.map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');
  }

  /* ── Filter & render ───────────────────────────────── */
  function applyFilters() {
    const q = searchInput.value.toLowerCase();
    const g = groupFilter.value;
    filtered = channels.filter(c =>
      (!q || c.name.toLowerCase().includes(q) || (c.group||'').toLowerCase().includes(q)) &&
      (!g || c.group === g)
    );
    renderList();
  }

  function renderList() {
    channelCount.textContent = `${filtered.length} canal${filtered.length !== 1 ? 'is' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;
    if (!filtered.length) {
      channelList.innerHTML = '<div class="empty-state">Nenhum canal encontrado</div>';
      return;
    }
    channelList.innerHTML = filtered.map((ch, i) => `
      <div class="channel-item${activeIdx === i ? ' active' : ''}" data-idx="${i}" title="${escHtml(ch.name)}">
        ${ch.logo
          ? `<img class="channel-logo" src="${escHtml(ch.logo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''}
        <div class="channel-logo-placeholder" style="${ch.logo ? 'display:none' : ''}">${escHtml(ch.name.substring(0,4))}</div>
        <div class="channel-info">
          <div class="channel-name">${escHtml(ch.name)}</div>
          ${ch.group ? `<div class="channel-group">${escHtml(ch.group)}</div>` : ''}
        </div>
      </div>`).join('');

    channelList.querySelectorAll('.channel-item').forEach(el => {
      el.addEventListener('click', () => playChannel(+el.dataset.idx));
    });
  }

  /* ── Playback ──────────────────────────────────────── */
  function playChannel(idx) {
    if (idx < 0 || idx >= filtered.length) return;
    activeIdx = idx;
    const ch = filtered[idx];
    renderList();
    scrollToActive();
    playUrl(ch.url, ch.name);
  }

  function playUrl(url, label = url) {
    if (!url) return;
    overlayMsg.style.display = 'none';
    npName.textContent = label;
    npUrl.textContent  = url;
    setStatus('loading');

    if (hls) { hls.destroy(); hls = null; }
    video.src = '';

    const isHLS = /\.m3u8/i.test(url) || url.includes('hls') || !url.match(/\.(mp4|ts|mkv|avi|webm)($|\?)/i);

    if (isHLS && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 30, enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) setStatus('error'); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    } else {
      video.src = url;
      video.play().catch(() => {});
    }
  }

  function scrollToActive() {
    const el = channelList.querySelector('.channel-item.active');
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /* ── Status indicator ──────────────────────────────── */
  function setStatus(s) {
    statusDot.className = 'status-dot' + (s === 'live' ? ' live' : s === 'error' ? ' error' : '');
    spinner.style.display = s === 'loading' ? 'block' : 'none';
  }

  video.addEventListener('playing', () => setStatus('live'));
  video.addEventListener('waiting', () => setStatus('loading'));
  video.addEventListener('error',   () => setStatus('error'));
  video.addEventListener('pause',   () => setStatus('idle'));

  /* ── Events ────────────────────────────────────────── */
  loadBtn.addEventListener('click', () => {
    const url = playlistSel.value;
    if (url) loadPlaylist(url);
  });

  playlistSel.addEventListener('change', () => {
    const url = playlistSel.value;
    if (url) loadPlaylist(url);
  });

  loadCustom.addEventListener('click', () => {
    const url = customUrl.value.trim();
    if (url) loadPlaylist(url);
  });

  customUrl.addEventListener('keydown', e => {
    if (e.key === 'Enter') loadCustom.click();
  });

  playStream.addEventListener('click', () => {
    const url = streamUrl.value.trim();
    if (url) { activeIdx = -1; playUrl(url, url); }
  });

  streamUrl.addEventListener('keydown', e => {
    if (e.key === 'Enter') playStream.click();
  });

  searchInput.addEventListener('input', applyFilters);
  groupFilter.addEventListener('change', applyFilters);

  /* ── Keyboard shortcuts ────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); playChannel(Math.min(activeIdx + 1, filtered.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); playChannel(Math.max(activeIdx - 1, 0)); }
    if (e.key === ' ')         { e.preventDefault(); video.paused ? video.play() : video.pause(); }
    if (e.key === 'f')         { video.requestFullscreen?.(); }
    if (e.key === 'm')         { video.muted = !video.muted; }
  });

  /* ── Helpers ───────────────────────────────────────── */
  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Auto-load Brazil playlist on start
  playlistSel.value = 'https://iptv-org.github.io/iptv/countries/br.m3u';
  loadPlaylist('https://iptv-org.github.io/iptv/countries/br.m3u');
</script>
</body>
</html>
