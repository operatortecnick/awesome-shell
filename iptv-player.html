<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f13;
      --surface:  #1a1a24;
      --surface2: #22222f;
      --border:   #2e2e40;
      --accent:   #6c63ff;
      --accent2:  #ff6584;
      --text:     #e8e8f0;
      --muted:    #8888aa;
    }

    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 320px 1fr;
      grid-template-areas: "header header" "sidebar player";
      height: 100vh;
    }

    /* ── Header ── */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      min-width: 0;
    }
    header h1 { font-size: 1rem; font-weight: 700; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0; }
    header h1 span { color: var(--accent); }

    .hdr-group { display: flex; gap: 6px; align-items: center; }
    .hdr-group label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .hdr-right { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }

    select, input, button {
      font-family: inherit;
      font-size: 0.82rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      padding: 5px 9px;
      outline: none;
      transition: border-color .15s;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button { background: var(--accent); border-color: var(--accent); cursor: pointer; font-weight: 600; transition: opacity .15s; }
    button:hover { opacity: .83; }
    button.sec { background: var(--surface2); border-color: var(--border); color: var(--text); }

    /* ── Sidebar ── */
    .sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .sidebar-top {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-bottom: 1px solid var(--border);
    }
    #searchInput { width: 100%; }
    .filter-row { display: flex; gap: 6px; }
    .filter-row select { flex: 1; min-width: 0; }

    .ch-count { font-size: 0.72rem; color: var(--muted); padding: 5px 12px 0; }

    /* Virtual scroll container */
    .ch-scroll {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    .ch-scroll::-webkit-scrollbar { width: 5px; }
    .ch-scroll::-webkit-scrollbar-track { background: transparent; }
    .ch-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* height spacer inside .ch-scroll */
    .vlist-spacer { position: relative; }

    .channel-item {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      overflow: hidden;
    }
    .channel-item:hover  { background: var(--surface2); }
    .channel-item.active { background: rgba(108,99,255,.18); border-left: 3px solid var(--accent); padding-left: 9px; }

    .ch-logo {
      width: 38px; height: 28px;
      object-fit: contain;
      border-radius: 4px;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .ch-logo-ph {
      width: 38px; height: 28px;
      background: var(--surface2);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.58rem; color: var(--muted);
      flex-shrink: 0; text-align: center; overflow: hidden;
    }
    .ch-info { min-width: 0; }
    .ch-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-grp  { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Player ── */
    .player-area {
      grid-area: player;
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }
    .video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video { width: 100%; height: 100%; object-fit: contain; }

    .overlay-msg {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--muted);
      pointer-events: none;
    }
    .overlay-msg svg { width: 56px; height: 56px; opacity: .35; }
    .overlay-msg p { font-size: 0.9rem; opacity: .65; }

    .player-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .now-playing { min-width: 0; flex: 1; }
    .np-name { font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-url  { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.live  { background: #4ade80; animation: pulse 1.4s infinite; }
    .status-dot.error { background: var(--accent2); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,.4); }
      50%      { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    }

    .custom-row {
      display: flex; gap: 7px; padding: 7px 14px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .custom-row input { flex: 1; }

    .spinner {
      position: absolute;
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 10px;
      color: var(--muted); font-size: 0.82rem;
      padding: 20px; text-align: center;
    }

    @media (max-width: 680px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 56px 50vh 1fr;
        grid-template-areas: "header" "player" "sidebar";
      }
      .sidebar { border-right: none; border-top: 1px solid var(--border); }
      .hdr-group label { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <h1>IPTV<span>·</span>Player</h1>
    <div class="hdr-right">
      <div class="hdr-group">
        <label>Playlist:</label>
        <select id="playlistSelect" style="max-width:240px"></select>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <input id="searchInput" type="search" placeholder="🔍 Buscar canal…" />
      <div class="filter-row">
        <select id="groupFilter"><option value="">Todos os grupos</option></select>
      </div>
    </div>
    <div class="ch-count" id="chCount"></div>
    <div class="ch-scroll" id="chScroll">
      <div class="empty-state">Selecione uma playlist no topo</div>
    </div>
  </aside>

  <!-- Player -->
  <main class="player-area">
    <div class="video-wrapper">
      <video id="video" controls playsinline></video>
      <div class="overlay-msg" id="overlayMsg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <p>Escolha um canal para começar</p>
      </div>
      <div class="spinner" id="spinner"></div>
    </div>

    <div class="player-bar">
      <div class="status-dot" id="statusDot"></div>
      <div class="now-playing">
        <div class="np-name" id="npName">Nenhum canal selecionado</div>
        <div class="np-url"  id="npUrl">—</div>
      </div>
    </div>

    <div class="custom-row">
      <input id="customUrl" type="url" placeholder="Cole uma URL de playlist M3U…" />
      <button id="loadCustomBtn" class="sec">Carregar M3U</button>
      <input id="streamUrl" type="url" placeholder="URL direta de stream (.m3u8 / .ts)…" />
      <button id="playStreamBtn" class="sec">▶ Play</button>
    </div>
  </main>

</div>

/* ─── State ───────────────────────────────────────────────────────── */
let channels   = [];

/* ─── M3U parser ──────────────────────────────────────────────────── */
function parseM3U(text) {
  const lines  = text.split(/\r?\n/);
  const result = [];
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')) {
      cur = { name: '', logo: '', group: '', url: '' };
      const nm = line.match(/,(.+)$/);      if (nm) cur.name = nm[1].trim();
      const lg = line.match(/tvg-logo="([^"]*)"/i);   if (lg) cur.logo  = lg[1];
      const gr = line.match(/group-title="([^"]*)"/i); if (gr) cur.group = gr[1];
      const tn = line.match(/tvg-name="([^"]*)"/i);
      if (tn && !cur.name) cur.name = tn[1];
    } else if (line.startsWith('#')) {
      /* skip */
    } else if (cur) {
      cur.url = line;
      if (cur.name || cur.url) result.push(cur);
      cur = null;
    }
  }
  return result;
}

/* ─── Load playlist ───────────────────────────────────────────────── */
async function loadPlaylist(url) {
  setStatus('loading');
  chScroll.innerHTML = '<div class="empty-state"><div class="spinner" style="display:block;margin:auto"></div><p style="margin-top:14px">Carregando canais…</p></div>';
  chCount.textContent = '';

  try {
    let text = '';
    const proxies = [
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url,
    ];
    for (const src of proxies) {
      try {
        const res = await fetch(src, { signal: AbortSignal.timeout(20000) });
        if (res.ok) { text = await res.text(); break; }
      } catch { /* next proxy */ }
    }
    if (!text) throw new Error('Não foi possível carregar a playlist. Verifique a URL ou sua conexão.');

    channels = parseM3U(text);
    if (!channels.length) throw new Error('Nenhum canal encontrado na playlist.');

    activeIdx = -1;
    populateGroups();
    searchInput.value = '';
    groupFilter.value = '';
    applyFilters();
    setStatus('idle');
  } catch (err) {
    chScroll.innerHTML = `<div class="empty-state">⚠️ ${esc(err.message)}</div>`;
    setStatus('idle');
  }
}

/* ─── Group dropdown ──────────────────────────────────────────────── */
function populateGroups() {
  const groups = [...new Set(channels.map(c => c.group).filter(Boolean))].sort();
  groupFilter.innerHTML = '<option value="">Todos os grupos</option>' +
    groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
}

/* ─── Filter ──────────────────────────────────────────────────────── */
function applyFilters() {
  const q = searchInput.value.toLowerCase();
  const g = groupFilter.value;
  filtered = channels.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q)) &&
    (!g || c.group === g)
  );
  chScroll.scrollTop = 0;
  renderVirtual();
}

/* ─── Virtual list ────────────────────────────────────────────────── */
let rafPending = false;

function scheduleRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; renderVirtual(); });
}

function renderVirtual() {
  const total = filtered.length;
  chCount.textContent = total
    ? `${total.toLocaleString('pt-BR')} canal${total !== 1 ? 'is' : ''}`
    : '';

  if (!total) {
    chScroll.innerHTML = '<div class="empty-state">Nenhum canal encontrado</div>';
    return;
  }

  const scrollTop      = chScroll.scrollTop;
  const visibleH       = chScroll.clientHeight || 600;
  const totalH         = total * ITEM_H;
  const BUFFER         = 8;
  const startIdx       = Math.max(0,       Math.floor(scrollTop / ITEM_H) - BUFFER);
  const endIdx         = Math.min(total-1, Math.ceil((scrollTop + visibleH) / ITEM_H) + BUFFER);

  let spacer = chScroll.querySelector('.vlist-spacer');
  if (!spacer) {
    chScroll.innerHTML = '<div class="vlist-spacer"></div>';
    spacer = chScroll.querySelector('.vlist-spacer');
  }
  spacer.style.height = totalH + 'px';

  // Remove items outside window
  chScroll.querySelectorAll('.channel-item').forEach(el => {
    const i = +el.dataset.idx;
    if (i < startIdx || i > endIdx) el.remove();
  });

  // Render missing items
  const existing = new Set([...chScroll.querySelectorAll('.channel-item')].map(e => +e.dataset.idx));
  const frag = document.createDocumentFragment();

  for (let i = startIdx; i <= endIdx; i++) {
    if (existing.has(i)) {
      // update active state if needed
      const el = chScroll.querySelector(`.channel-item[data-idx="${i}"]`);
      if (el) el.classList.toggle('active', activeIdx === i);
      continue;
    }
    const ch  = filtered[i];
    const el  = document.createElement('div');
    el.className = 'channel-item' + (activeIdx === i ? ' active' : '');
    el.dataset.idx = i;
    el.title = ch.name;
    el.style.top    = (i * ITEM_H) + 'px';
    el.style.height = ITEM_H + 'px';

    if (ch.logo) {
      el.innerHTML = `
        <img class="ch-logo" src="${esc(ch.logo)}" alt="" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="ch-logo-ph" style="display:none">${esc(ch.name.substring(0,4))}</div>`;
    } else {
      el.innerHTML = `<div class="ch-logo-ph">${esc(ch.name.substring(0,4))}</div>`;
    }
    el.innerHTML += `
      <div class="ch-info">
        <div class="ch-name">${esc(ch.name)}</div>
        ${ch.group ? `<div class="ch-grp">${esc(ch.group)}</div>` : ''}
      </div>`;

    el.addEventListener('click', () => playChannel(i));
    frag.appendChild(el);
  }

  spacer.appendChild(frag);
}

chScroll.addEventListener('scroll', scheduleRender, { passive: true });

/* ─── Playback ────────────────────────────────────────────────────── */
function playChannel(idx) {
  if (idx < 0 || idx >= filtered.length) return;
  activeIdx = idx;
  renderVirtual();
  // Scroll active item into view
  const top = idx * ITEM_H;
  const scrollTop = chScroll.scrollTop;
  const visH = chScroll.clientHeight;
  if (top < scrollTop || top + ITEM_H > scrollTop + visH) {
    chScroll.scrollTop = top - visH / 2 + ITEM_H / 2;
  }
  playUrl(filtered[idx].url, filtered[idx].name);
}

function playUrl(url, label = url) {
  if (!url) return;
  overlayMsg.style.display = 'none';
  npName.textContent = label;
  npUrl.textContent  = url;
  setStatus('loading');

  if (hls) { hls.destroy(); hls = null; }
  video.src = '';

  const isHLS = /\.m3u8/i.test(url) || /hls/i.test(url) ||
                !url.match(/\.(mp4|ts|mkv|avi|webm|flv)($|\?)/i);

  if (isHLS && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30, enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setStatus('error'); });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play().catch(() => {});
  } else {
    video.src = url;
    video.play().catch(() => {});
  }
}

/* ─── Status ──────────────────────────────────────────────────────── */
function setStatus(s) {
  statusDot.className = 'status-dot' + (s === 'live' ? ' live' : s === 'error' ? ' error' : '');
  spinner.style.display = s === 'loading' ? 'block' : 'none';
}
video.addEventListener('playing', () => setStatus('live'));
video.addEventListener('waiting', () => setStatus('loading'));
video.addEventListener('error',   () => setStatus('error'));
video.addEventListener('pause',   () => setStatus('idle'));

/* ─── Events ──────────────────────────────────────────────────────── */
playlistSel.addEventListener('change', () => { if (playlistSel.value) loadPlaylist(playlistSel.value); });

loadCustom.addEventListener('click', () => { const u = customUrl.value.trim(); if (u) loadPlaylist(u); });
customUrl.addEventListener('keydown', e => { if (e.key === 'Enter') loadCustom.click(); });

playStream.addEventListener('click', () => {
  const u = streamUrl.value.trim();
  if (u) { activeIdx = -1; playUrl(u, u); }
});
streamUrl.addEventListener('keydown', e => { if (e.key === 'Enter') playStream.click(); });

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 220);
});
groupFilter.addEventListener('change', applyFilters);

/* ─── Keyboard shortcuts ──────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); playChannel(Math.min(activeIdx + 1, filtered.length - 1)); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); playChannel(Math.max(activeIdx - 1, 0)); }
  if (e.key === ' ')         { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  if (e.key === 'f')         { video.requestFullscreen?.(); }
  if (e.key === 'm')         { video.muted = !video.muted; }
});

}
